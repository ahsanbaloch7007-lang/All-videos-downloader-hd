name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER_STRING"
          if [ -z "$JAVA_VER_STRING" ]; then
            echo "ERROR: Unable to detect Java version from environment." >&2
            exit 1
          fi
          MAJOR_VER=$(echo "$JAVA_VER_STRING" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected active Java major version: $MAJOR_VER"
          if [ -z "$MAJOR_VER" ] || [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but active version is: $MAJOR_VER" >&2
            exit 1
          fi
          echo "Confirmed: Java $MAJOR_VER environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "./debug.keystore does not exist. Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "./debug.keystore already exists."
          fi

          if [ -f "./debug.keystore" ]; then
            echo "Confirmed: ./debug.keystore is present."
          else
            echo "ERROR: Failed to create ./debug.keystore" >&2
            exit 1
          fi

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ]; then
            if [ ! -s "$EXPECTED_APK" ]; then
              echo "ERROR: $EXPECTED_APK exists but is empty!" >&2
              exit 1
            fi
            if [[ "$EXPECTED_APK" != *.apk ]]; then
              echo "ERROR: $EXPECTED_APK does not have the .apk extension!" >&2
              exit 1
            fi
            echo "Confirmed: Debug APK exists, is non-empty, and has .apk extension."
            ls -lh "$EXPECTED_APK"
          else
            echo "ERROR: Expected APK not found at $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" >&2 || true
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR="${{ runner.temp }}/apk-release-asset"
          mkdir -p "$TEMP_ASSET_DIR"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME=$(basename "${{ github.repository }}")
          fi

          # Sanitize repository name: lowercase, letters, digits, dots, underscores, dashes
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="app"
          fi

          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${{ github.run_number }}.apk"
          TARGET_ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_ASSET_PATH"

          if [ ! -s "$TARGET_ASSET_PATH" ] || [[ "$TARGET_ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Failed to prepare valid release asset at $TARGET_ASSET_PATH" >&2
            exit 1
          fi

          echo "Prepared release asset: $TARGET_ASSET_PATH"
          echo "asset_path=$TARGET_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset missing or empty: $ASSET_PATH" >&2
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH" >&2
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES=$(cat << 'EOF'
          ### Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run:** #${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** `${{ github.sha }}`
          - **Asset Name:** `__ASSET_NAME__`

          > **Note:** This APK is intended for testing and development purposes. It is not a Google Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )
          RELEASE_NOTES="${RELEASE_NOTES//__ASSET_NAME__/$ASSET_NAME}"

          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$RELEASE_NOTES"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=========================================================="
            echo " GitHub Release Succeeded!"
            echo "=========================================================="
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Asset Filename: $ASSET_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}")
            echo "Release URL: $RELEASE_URL"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
            ## :rocket: Debug APK Published to GitHub Releases

            - **Release Tag:** \`$TAG_NAME\`
            - **Direct Release Page:** [$RELEASE_TITLE]($RELEASE_URL)
            - **Downloadable APK Asset:** \`$ASSET_NAME\`

            You can download the APK file directly on your mobile device from the **Assets** section of the [GitHub Release]($RELEASE_URL).

            *(Backup: The standard GitHub Actions artifact \`app-debug-apk\` is also preserved.)*
            EOF
          else
            echo "=========================================================="
            echo " NOTICE: GitHub Release Publishing Not Completed"
            echo "=========================================================="
            echo "The APK build and verification succeeded."
            echo "The debug APK artifact 'app-debug-apk' was successfully uploaded and remains available in this run's Artifacts section."

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
            ## :warning: GitHub Release Notice

            The debug APK was **successfully built and verified**, but publishing directly to GitHub Releases could not be completed.

            - **Actions Artifact Available:** The APK is available for download under the **Artifacts** section of this workflow run as \`app-debug-apk\`.
            - **Build Status:** APK compilation and verification succeeded.
            EOF
          fi
