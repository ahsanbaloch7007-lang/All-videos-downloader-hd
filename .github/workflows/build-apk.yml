name: Build & Publish Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkeypair -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p "${{ runner.temp }}/apk-release-asset"
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET="${REPO}-debug-build-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${{ runner.temp }}/apk-release-asset/${ASSET}"
          echo "asset_path=${{ runner.temp }}/apk-release-asset/${ASSET}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }} "${{ steps.prepare_asset.outputs.asset_path }}" --title "Debug APK Build #${{ github.run_number }}" --latest --notes "Final Build #${{ github.run_number }} | Asset: ${{ steps.prepare_asset.outputs.asset_name }} | Earning Ads | Install Ready"

      - name: Report APK download result
        if: always()
        run: |
          echo "Build Success: ${{ steps.prepare_asset.outputs.asset_name }}"
          echo "## :rocket: APK Published" >> $GITHUB_STEP_SUMMARY
          echo "File: ${{ steps.prepare_asset.outputs.asset_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Build #${{ github.run_number }} Ready for Install & Publish" >> $GITHUB_STEP_SUMMARY
